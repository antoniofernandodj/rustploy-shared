[package]
name = "rustploy-update-core"
version = "0.3.3"
edition = "2024"
description = "Shared update logic for the Rustploy daemon and desktop app: release version comparison"
license = "MIT"
authors = ["Antonio Fernando <antoniofernando2723@gmail.com>"]
repository = "https://github.com/antoniofernandodj/rustploy-shared"
keywords = ["paas", "update"]
categories = ["development-tools"]

[dependencies]
libc = "0.2.191"
minisign-verify = "0.3.0"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
