[package]
name = "rustploy-shared"
version = "0.7.0"
edition = "2024"
description = "Shared types and protocol definitions for the Rustploy PaaS platform"
license = "MIT"
authors = ["Antonio Fernando <antoniofernando2723@gmail.com>"]
repository = "https://github.com/antoniofernandodj/rustploy-shared"
keywords = ["paas", "deploy", "docker"]
categories = ["data-structures"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

